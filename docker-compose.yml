name: relay

x-node-service: &node-service
  build:
    context: .
    dockerfile: docker/node.Dockerfile
  environment:
    DATABASE_URL: postgres://relay:relay@postgres:5432/relay
    REDIS_URL: redis://redis:6379
    NODE_HOST_URL: http://node-host:8080
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  node-host:
    build:
      context: ./dotnet
      dockerfile: Relay.NodeHost/Dockerfile
    ports:
      - "5080:8080"

  migrate:
    <<: *node-service
    profiles: ["tools"]
    command: ["pnpm", "--filter", "@relay/api", "migrate"]

  api:
    <<: *node-service
    profiles: ["full"]
    command: ["pnpm", "--filter", "@relay/api", "start"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      REDIS_URL: redis://redis:6379
      NODE_HOST_URL: http://node-host:8080
      API_PORT: 3001
      API_CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"

  worker:
    <<: *node-service
    profiles: ["full"]
    command: ["pnpm", "--filter", "@relay/worker", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      node-host:
        condition: service_started

volumes:
  pgdata: {}